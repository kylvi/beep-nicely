<div class="switch">
  <button data-pose="s-home p-work" aria-pressed="true">Home</button>
  <button data-pose="s-run is-close p-work" aria-pressed="false">Timer: work</button>
  <button data-pose="s-run is-close p-rest" aria-pressed="false">Timer: rest</button>
  <button data-pose="s-paused is-close p-work" aria-pressed="false">Paused</button>
  <button data-pose="s-home p-work sheet-open" aria-pressed="false">Settings</button>
  <button data-pose="s-home p-work is-done" aria-pressed="false">Finished</button>
</div>

<script>
  // The whole idea of the hamster: JavaScript only swaps class names, CSS does the moving.
  const screen = document.getElementById('screen');
  const buttons = document.querySelectorAll('.switch button');

  buttons.forEach(function (button) {
    button.addEventListener('click', function () {
      screen.className = 'screen ' + button.dataset.pose;
      buttons.forEach(function (other) {
        other.setAttribute('aria-pressed', other === button ? 'true' : 'false');
      });
    });
  });
</script>
